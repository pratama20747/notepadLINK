services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: notepad-sharelink:latest
    container_name: notepad_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "5050"
      APP_ENV: production
      DATABASE_URL: postgres://myuser:mypassword@postgres:5432/mydatabase?sslmode=disable
      ALLOWED_ORIGINS: ""
      # Cloudflare R2 - isi jika fitur attachment diaktifkan
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_PUBLIC_BASE_URL: ""
    ports:
      - "5050:5050"

  postgres:
    image: postgres:16.3-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Docker volume - tidak muncul di root proyek
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

# Define volumes di sini
volumes:
  postgres_data:
    driver: local
  postgres_backup:
    driver: local
